# Data manifest. Every external pull is keyed by `name` and checked
# against `sha256` after download. `snapshotDate` is the date we
# verified the URL still serves the expected content.
#
# Entries with sha256: 'pending' need a one-time verification run; the
# next successful cacheFetch will write a sha256-stamped sister file
# under data/raw/.sha/.

yahoo:
  - name: SPX
    ticker: ^GSPC
    start: 2014-01-01
    end:   2024-01-01
    url:   https://query1.finance.yahoo.com/v7/finance/download/%5EGSPC?period1={start_unix}&period2={end_unix}&interval=1d&events=history
    snapshotDate: 2026-05-16
    sha256: pending
  - name: N225
    ticker: ^N225
    start: 2014-01-01
    end:   2024-01-01
    url:   https://query1.finance.yahoo.com/v7/finance/download/%5EN225?period1={start_unix}&period2={end_unix}&interval=1d&events=history
    snapshotDate: 2026-05-16
    sha256: pending
  - name: DJI
    ticker: ^DJI
    url:   https://query1.finance.yahoo.com/v7/finance/download/%5EDJI?period1={start_unix}&period2={end_unix}&interval=1d&events=history
    snapshotDate: 2026-05-16
    sha256: pending

